<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S Mobile Edition</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="jarvis-wrapper">
    <!-- Header Title -->
    <header class="jarvis-header">
      <h1>J.A.R.V.I.S</h1>
      <span class="subtitle">MOBILE EDITION</span>
    </header>

    <!-- Concentric Rotating Arc Core -->
    <div class="core-wrapper" onclick="jarvis.toggleListening()">
      <div class="outer-ring"></div>
      <div class="middle-ring"></div>
      <div class="inner-core"></div>
    </div>
    <div class="core-status" id="coreStatus">CORE ACTIVE</div>
// PASTE YOUR API KEY BELOW (Inside the quotes)
const API_KEY = "AQ.Ab8RN6Iqd-i2OIpl4VyW9WaaTmacEI4rrjiz6fChlR_6lWjK3g";
    <!-- System Status Panel -->
    <div class="hud-panel">
      <div class="panel-title">SYSTEM STATUS</div>
      <div class="status-row">
        <span>AI CORE</span>
        <span class="status-val green">• ONLINE</span>
      </div>
      <div class="status-row">
        <span>NETWORK</span>
        <span class="status-val green">• ONLINE</span>
      </div>
      <div class="status-row">
        <span>VOICE</span>
        <span class="status-val red" id="voiceStatus">LOCKED</span>
      </div>
      <div class="status-row">
        <span>MEMORY</span>
        <span class="status-val red" id="memoryStatus">LOCKED</span>
      </div>
    </div>

    <!-- Terminal Output -->
    <div class="terminal-box" id="statusLog">
      Awaiting user authorization...
    </div>

    <!-- Input Action Bar -->
    <div class="input-bar">
      <input type="text" id="textInput" placeholder="Ask J.A.R.V.I.S..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendTextCommand()">SEND</button>
    </div>
  </div>

  <script src="jarvis.js"></script>
  <script>
    function sendTextCommand() {
      const input = document.getElementById('textInput');
      if (input.value.trim() !== '') {
        jarvis.processCommand(input.value);
        input.value = '';
      }
    }
    function handleKeyPress(e) {
      if (e.key === 'Enter') sendTextCommand();
    }
  </script>
</body>
</html>
